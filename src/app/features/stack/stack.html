<section id="stack" class="container section divided" aria-labelledby="stack-title">
  <app-section-heading
    [index]="2"
    [kicker]="stack().kicker"
    [title]="stack().title"
    titleId="stack-title"
  />
  <p class="note">{{ stack().note }}</p>

  <div class="grid">
    @for (group of stack().groups; track group.title) {
      <div class="group">
        <h3 class="group-title">{{ group.title }}</h3>
        <ul class="tags" role="list">
          @for (item of group.items; track item) {
            <li class="tag">{{ item }}</li>
          }
        </ul>
      </div>
    }
  </div>
</section>

<nav class="nav" [attr.aria-label]="nav().ariaLabel">
  <div class="container bar">
    <a class="brand" [routerLink]="homePath()" fragment="top" (click)="closeMenu()"
      ><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span> {{ profile.name }}</a
    >

    <div class="actions">
      <div id="nav-links" class="links" [class.open]="menuOpen()">
        @for (section of nav().sections; track section.id) {
          <a class="link" [routerLink]="homePath()" [fragment]="section.id" (click)="closeMenu()">{{
            section.label
          }}</a>
        }
      </div>

      <a
        class="lang"
        [routerLink]="switchPath()"
        [attr.aria-label]="nav().switchAria"
        [attr.hreflang]="lang() === 'pt' ? 'en' : 'pt-BR'"
        >{{ nav().switchLabel }}</a
      >

      <button
        class="toggle"
        type="button"
        aria-controls="nav-links"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="nav().menuLabel"
        (click)="toggleMenu()"
      >
        <span></span>
        <span></span>
        <span class="accent"></span>
      </button>
    </div>
  </div>
</nav>

<nav class="nav" [attr.aria-label]="nav().ariaLabel">
  <div class="row-top">
    <a class="brand" [routerLink]="homePath()" fragment="top">{{ profile.name }}</a>
    <a
      class="lang"
      [routerLink]="switchPath()"
      [attr.aria-label]="nav().switchAria"
      [attr.hreflang]="lang() === 'pt' ? 'en' : 'pt-BR'"
      >{{ nav().switchLabel }}</a
    >
  </div>
  <div class="links">
    @for (section of nav().sections; track section.id) {
      <a class="link" [routerLink]="homePath()" [fragment]="section.id">{{ section.label }}</a>
    }
  </div>
</nav>

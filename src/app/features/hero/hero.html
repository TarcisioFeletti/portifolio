<header class="container hero" id="top">
  <div class="grid">
    <div class="portrait">
      <img
        ngSrc="assets/portrait.webp"
        width="600"
        height="600"
        priority
        [alt]="hero().portraitAlt"
      />
    </div>

    <div class="intro">
      <p class="role">{{ hero().role }}</p>
      <h1 class="name">{{ profile.name }}</h1>
      <p class="value-prop">{{ hero().valueProp }}</p>

      <div class="ctas">
        <a class="cta-primary" [href]="'mailto:' + profile.email">{{ hero().ctaMail }}</a>
        <a class="cta" [href]="linkedin.url" target="_blank" rel="noopener noreferrer">{{
          linkedin.label
        }}</a>
        <a class="cta cta-cv" [href]="profile.cvPath" [attr.download]="profile.cvFileName">{{
          hero().ctaCv
        }}</a>
        <a class="cta" [href]="github.url" target="_blank" rel="noopener noreferrer">{{
          github.label
        }}</a>
      </div>

      <ul class="highlights">
        @for (item of hero().highlights; track $index) {
          <li>
            <span class="highlight-value">{{ item.value }}</span> {{ item.label }}
          </li>
        }
      </ul>
    </div>
  </div>
</header>

<header class="hero" id="top">
  <div class="portrait">
    <img ngSrc="assets/portrait.webp" fill priority sizes="36vw" [alt]="hero().portraitAlt" />
  </div>
  <h1 class="name">{{ profile.name }}</h1>
  <p class="role">{{ hero().role }}</p>
  <p class="value-prop">{{ hero().valueProp }}</p>
  <div class="ctas">
    <a class="cta-primary" [href]="linkedin.url" target="_blank" rel="noopener noreferrer">
      {{ linkedin.label }}
    </a>
    <a class="cta" [href]="'mailto:' + profile.email">{{ hero().ctaMail }}</a>
    @for (social of otherSocials; track social.label) {
      <a class="cta" [href]="social.url" target="_blank" rel="noopener noreferrer">{{
        social.label
      }}</a>
    }
  </div>
</header>

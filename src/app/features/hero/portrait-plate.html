<figure class="plate">
  <div class="tint" aria-hidden="true"></div>
  <div class="perforation left" aria-hidden="true"></div>
  <div class="perforation right" aria-hidden="true"></div>
  <div class="hud plate-hud" aria-hidden="true">
    <span>{{ plate().left }}</span>
    <span>{{ plate().right }}</span>
  </div>

  <div class="stage">
    <div class="viewfinder">
      <div class="viewfinder-border" aria-hidden="true"></div>
      <div class="portrait">
        <img ngSrc="assets/portrait-bg.png" fill priority [alt]="plate().portraitAlt" />
      </div>
      <div class="viewfinder-marks corners" aria-hidden="true">
        <span class="crosshair"></span>
      </div>
      <figcaption class="hud focus">{{ plate().focus }}</figcaption>
    </div>

    <ul class="stickers" role="list">
      @for (sticker of plate().stickers; track $index) {
        <li [class]="'sticker s' + ($index + 1)">
          <span class="sticker-title">{{ sticker.title }}</span>
          @if (sticker.subtitle) {
            <span class="sticker-sub">{{ $index === 2 ? '→ ' : '' }}{{ sticker.subtitle }}</span>
          }
          @if ($index === 5) {
            <span class="spin" aria-hidden="true"></span>
          }
        </li>
      }
    </ul>
  </div>
</figure>

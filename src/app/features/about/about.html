<div class="marquee" aria-hidden="true">
  <div class="marquee-track">
    <span>{{ about().marquee }}</span>
    <span>{{ about().marquee }}</span>
  </div>
</div>

<section id="sobre" class="about" aria-labelledby="about-title">
  <app-section-header index="01" [reel]="about().reel" />
  <div class="columns">
    <div>
      <p class="kicker"><span class="dot" aria-hidden="true"></span>{{ about().kicker }}</p>
      <h2 id="about-title" class="section-title">{{ about().title }}</h2>
    </div>
    <div class="body">
      @for (paragraph of about().paragraphs; track $index; let first = $first) {
        <p [class.lead]="first">{{ paragraph }}</p>
      }
    </div>
  </div>

  <dl class="stats">
    @for (stat of about().stats; track stat.label) {
      <div class="stat">
        <dt class="stat-label">{{ stat.label }}</dt>
        <dd class="stat-value" [style.color]="stat.accent | accent">{{ stat.value }}</dd>
      </div>
    }
  </dl>
</section>

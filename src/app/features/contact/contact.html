@let c = contact();

<footer id="contato" class="contact" aria-labelledby="contact-title">
  <div class="container inner">
    <app-section-heading
      [index]="6"
      [kicker]="c.kicker"
      [title]="c.title"
      titleId="contact-title"
      size="large"
    />

    <div class="grid">
      <div class="channels">
        <div>
          <p class="label">{{ c.emailLabel }}</p>
          <a class="email" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
        </div>
        <div>
          <p class="label">{{ c.profilesLabel }}</p>
          <div class="profiles">
            <a class="pill" [href]="linkedin.url" target="_blank" rel="noopener noreferrer">{{
              linkedin.label
            }}</a>
            <a class="pill cta-cv" [href]="profile.cvPath" [attr.download]="profile.cvFileName">{{
              c.ctaCv
            }}</a>
            <a class="pill" [href]="github.url" target="_blank" rel="noopener noreferrer">{{
              github.label
            }}</a>
          </div>
        </div>
      </div>

      <div>
        <p class="label">{{ c.locationLabel }}</p>
        <p class="location">{{ c.location }}</p>
      </div>
    </div>

    <div class="bottom">
      <small class="copyright">© {{ profile.year }} — {{ c.footerRole }}</small>
      <a class="source" [href]="profile.repo" target="_blank" rel="noopener noreferrer"
        >{{ c.sourceLabel }} <span aria-hidden="true">↗</span></a
      >
    </div>
  </div>
</footer>

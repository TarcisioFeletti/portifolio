@let c = content();

<a class="skip-link" href="#main" (click)="skipToMain($event, main)">{{ c.skipLink }}</a>
<app-film-overlay />
<app-top-hud [hud]="c.hud" />
<app-site-nav [nav]="c.nav" [lang]="c.lang" />

<main #main id="main" tabindex="-1">
  <app-hero [hero]="c.hero" [hud]="c.hud" />
  <app-portrait-plate [plate]="c.plate" />
  <app-readout-strip [strip]="c.strip" />
  <app-about [about]="c.about" />
  <app-stack [stack]="c.stack" />
  <app-experience [experience]="c.experience" />
  <app-projects [projects]="c.projects" />
  <app-education [education]="c.education" />
</main>

<app-contact [contact]="c.contact" [ctaCv]="c.hero.ctaCv" />
